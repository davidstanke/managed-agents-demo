name: Review Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to review (e.g. 1)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  review:
    name: Run Reviewer Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Resolve PR Metadata
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ inputs.pr_number }}"
            BRANCH="${{ github.ref_name }}"
            BASE_BRANCH="${{ github.event.repository.default_branch || 'main' }}"
          else
            PR_NUM="${{ github.event.pull_request.number }}"
            BRANCH="${{ github.event.pull_request.head.ref }}"
            BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          fi

          if [ -z "$PR_NUM" ]; then
            echo "::error::No Pull Request number resolved."
            exit 1
          fi

          echo "Target PR Number: #$PR_NUM"
          echo "Head Branch:      $BRANCH"
          echo "Base Branch:      $BASE_BRANCH"

          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: 'id_token'
          id_token_audience: ${{ vars.REVIEWER_SERVICE_URL }}
          id_token_include_email: true

      - name: Invoke Reviewer Agent on Cloud Run
        env:
          REVIEWER_SERVICE_URL: ${{ vars.REVIEWER_SERVICE_URL }}
          GCP_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          BASE_BRANCH: ${{ steps.resolve.outputs.base_branch }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/invoke_reviewer_cloud_run.py
